<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NERTA ROBOT MONITOTING SYSTEM</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand_logo" style="font-size: larger;">N</div>

            <div>
            <h1 style="color: #2077e2;letter-spacing: 3px;">NETRA</h1>
            <p style="font-size: 9px;">ROBOT MISSION CONTROL</p>
            </div>
        </div>
        <nav>
            <a href="#dashboard">DASHBOARD</a>
            <a href="#fleet">Fleet</a>
            <a href="#telemetry">TELEMETRY</a>
            <a href="#alerts">ALERTS</a>
        </nav>
        <div class="header right">
            <span class="online-dot "></span>
            <span>SYSTEM ONLINE</span>
            <strong id="clock">--:--:--</strong>
        </div>
        <bUtton id="dispatch-open" type="bUtton"> DISPATCH MISSION</bUtton>
<script>
    function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock(); 
</script>
        

    </header> 
</body>
</html>
